# Test-only upstream. Mount over logging.conf in the integration container.
server {
    listen 19080;
    location = /login {
        default_type text/html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self'; frame-src 'none'; object-src 'none'; form-action 'self'" always;
        add_header ETag '"fixture-login"';
        return 200 '<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>로그인 · 테스트</title><link rel="stylesheet" href="/console/fixture.css"></head><body><main><h1>로그인</h1><form method="post" action="/auth/login"><label>이메일<input name="email" type="email" required></label><label>비밀번호<input name="password" type="password" required></label><button type="submit">로그인</button></form></main></body></html>';
    }
    location = /auth/login {
        content_by_lua_block {
            local calls = ngx.shared.pingcha_challenges:incr('test_login_calls', 1, 0)
            ngx.header.content_type = 'application/json'
            ngx.say(require('cjson').encode({backend = true, calls = calls}))
        }
    }
    location = /fixture.css {
        default_type text/css;
        return 200 'body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fafafa;font:16px sans-serif;color:#292d32}main{width:300px;padding:32px;border:1px solid #eee;border-radius:20px;background:white}h1{font-size:26px;margin:0 0 28px}form,label{display:grid;gap:12px}form{gap:22px}input,button{font:inherit;padding:12px;border:1px solid #ddd;border-radius:10px}button{background:#ff0055;color:white;border:0;cursor:pointer}';
    }
    location = /headers {
        content_by_lua_block {
            ngx.header.content_type = 'application/json'
            ngx.say(require('cjson').encode({encoding = ngx.var.http_accept_encoding or '', etag = ngx.var.http_if_none_match or ''}))
        }
    }
    location = /auth/__pingcha_test_expire {
        content_by_lua_block {
            ngx.shared.pingcha_challenges:flush_all()
            ngx.shared.pingcha_clearances:flush_all()
            ngx.say('expired')
        }
    }
    location / {
        default_type application/json;
        return 200 '{"backend":true}';
    }
}
