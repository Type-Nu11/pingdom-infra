# 문서 경로에만 적용해 일반 API의 인증 및 전달 헤더 동작을 유지한다.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $openapi_forwarded_scheme;
proxy_set_header X-Forwarded-Port $openapi_forwarded_port;
proxy_set_header X-Forwarded-For $openapi_forwarded_for;
proxy_set_header Forwarded "";
