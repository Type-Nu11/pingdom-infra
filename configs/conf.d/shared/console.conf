# Public console pages; API authentication is enforced by the existing web gateway.
location = / {
    absolute_redirect off;
    return 302 /console/login;
}

location = /console {
    absolute_redirect off;
    return 302 /console/login;
}

location ^~ /console/ {
    include configs/conf.d/shared/proxy_header.conf;
    proxy_pass http://${CONSOLE_HOST}:${CONSOLE_PORT}/;
}

# Preserve old links without exposing the internal HTTP listener in Location.
location = /operator {
    absolute_redirect off;
    return 302 /console/login;
}

location ^~ /operator/ {
    absolute_redirect off;
    rewrite ^/operator/(.*)$ /console/$1 redirect;
}

# Preserve /api/ for the console Nginx adapter, which calls the web JWT gateway.
location ^~ /api/ {
    include configs/conf.d/shared/proxy_header.conf;
    proxy_pass http://${CONSOLE_HOST}:${CONSOLE_PORT};
}

location = /pingdom-logo.png {
    include configs/conf.d/shared/proxy_header.conf;
    proxy_pass http://${CONSOLE_HOST}:${CONSOLE_PORT}/pingdom-logo.png;
}
