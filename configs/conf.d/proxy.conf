proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;

# 타임아웃 최적화
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

# 리다이렉트 주소 정보 숨기기
proxy_hide_header Location;
proxy_hide_header Server;

header_filter_by_lua_block {
    -- 기존 Server 헤더(nginx/1.x.x)를 아예 삭제
    ngx.header.server = "clash.kr"
        
    -- 혹시 백엔드에서 보낸 다른 정체성 정보들도 삭제
    ngx.header["X-Powered-By"] = nil
    ngx.header["X-AspNet-Version"] = nil
};

proxy_set_header Host pingdom.kr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# 포트 주소를 숨기고 리디렉션 방지, 헤더에 도메인 추가
port_in_redirect off;

# 버퍼 설정 (성능 최적화)
proxy_buffers 32 4k;


