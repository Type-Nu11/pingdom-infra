# L4_Proxy Rust edge uses host networking and replaces incoming X-Real-IP
# with the TLS connection's peer IP. Host -> published Docker port reaches
# this container through the dedicated bridge gateway configured in Compose.
# Trust only this host gateway, never all private networks or arbitrary XFF.
set_real_ip_from 172.30.79.1;
real_ip_header X-Real-IP;
real_ip_recursive off;
