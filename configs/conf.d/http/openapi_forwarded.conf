# TLS 종료 프록시의 직접 연결 IP만 원래 scheme과 client IP를 전달할 수 있다.
geo $openapi_trusted_proxy {
    default 0;
    include configs/conf.d/shared/openapi_trusted_proxies.conf;
}

map "$openapi_trusted_proxy:$http_x_forwarded_proto" $openapi_forwarded_scheme {
    default $scheme;
    "1:http" http;
    "1:https" https;
}

# 공개 API는 기본 HTTP/HTTPS 포트를 사용한다. 내부 listen 8081을 전달하지 않는다.
map $openapi_forwarded_scheme $openapi_forwarded_port {
    default 80;
    https 443;
}

map $openapi_trusted_proxy $openapi_forwarded_for {
    default $remote_addr;
    1 $proxy_add_x_forwarded_for;
}
