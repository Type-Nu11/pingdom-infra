# Use the connection address (or an address restored by a separately configured
# trusted real-IP module). Never trust arbitrary client forwarding headers.
geo $swagger_client_allowed {
    default 0;
    34.127.98.202/32 1;
}

# $uri is normalized by nginx and excludes query parameters.
map $uri $swagger_route {
    default 0;
    ~*^/(?:api/)?(?:swagger-ui(?:[/.]|$)|v[23]/api-docs(?:[/.]|$)|swagger-resources(?:/|$)|webjars/(?:swagger-ui|springfox-swagger-ui)(?:/|$)) 1;
}

map "$swagger_route:$swagger_client_allowed" $swagger_denied {
    default 0;
    "1:0" 1;
}
