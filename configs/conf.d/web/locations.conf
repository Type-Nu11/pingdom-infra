include configs/conf.d/shared/console.conf;

location = /swagger-ui {
    return 301 /swagger-ui/;
}

location = /swagger-ui/ {
    include configs/conf.d/shared/proxy_header.conf;
    proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT}/swagger-ui/index.html;
}

location = /swagger-ui.html {
    include configs/conf.d/shared/proxy_header.conf;
    proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
}

location ^~ /swagger-ui/ {
    include configs/conf.d/shared/proxy_header.conf;
    proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
}

location ^~ /v3/api-docs/ {
    include configs/conf.d/shared/proxy_header.conf;
    proxy_buffering off;
    proxy_redirect off;
    proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
}

location = /favicon.ico {
    include configs/conf.d/shared/proxy_header.conf;
    proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
}

location ^~ /auth/ {
    include configs/conf.d/shared/proxy_header.conf;
    proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
}

location = /actuator/health {
    include configs/conf.d/shared/proxy_header.conf;
    proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
}

# Remote MCP uses the web JWT policy and its own upstream, rather than Spring.
location = /mcp {
    limit_req zone=web_ip_limit burst=40 nodelay;
    limit_conn web_conn_limit 30;
    access_by_lua_file /src/lua/web_entry.lua;
    include configs/conf.d/shared/proxy_header.conf;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header mcp-token $http_mcp_token;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_pass http://${MCP_HOST}:${MCP_PORT};
}

# Keep backend API namespaces authenticated, including collection URLs without
# a trailing slash. The segment boundary prevents /users-typo matching /users.
# Add new top-level backend API namespaces here before exposing them on the web.
location ~ ^/(admin|analysis|auth|community|consultations|coupons|events|firebase|location-check-ins|merchant-owner|notifications|offers|payments|places|popup-campaigns|reservations|routes|scout-field-reports|users|visit-verification-sessions|visitor-verification-reports|voice-ai|actuator|error|login|oauth2|mcp|v3/api-docs)(/|$) {
    limit_req zone=web_ip_limit burst=40 nodelay;
    limit_conn web_conn_limit 30;
    access_by_lua_file /src/lua/web_entry.lua;
    include configs/conf.d/shared/proxy_header.conf;
    proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
}

# Unknown web paths have no API upstream. Keep this relative so HTTPS callers
# never receive an internal proxy host/port; /console/ has its own location.
location / {
    absolute_redirect off;
    return 302 /console/login;
}
