location ^~ /auth/ {
    limit_req zone=app_ip_limit burst=40 nodelay;
    limit_conn app_conn_limit 30;
    include configs/conf.d/shared/proxy_header.conf;
    proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
}

# Collection endpoints without a trailing slash must not trigger Nginx's
# automatic absolute redirect to the internal app-proxy port.
location = /reservations {
    limit_req zone=app_ip_limit burst=40 nodelay;
    limit_conn app_conn_limit 30;
    access_by_lua_file /src/lua/app_entry.lua;
    include configs/conf.d/shared/proxy_header.conf;
    proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
}

