location = /ai/chat {
    limit_req zone=ai_chat_limit burst=5 nodelay;
    limit_conn ai_chat_conn_limit 10;

    # Authenticate the app before adapting the public contract for Groq.
    access_by_lua_file /src/lua/app_entry.lua;
    content_by_lua_file /src/lua/ai_entry.lua;
    client_max_body_size 1m;
    client_body_buffer_size 1m;
    set $groq_authorization "";
    set $ai_request_id "";
}

# Only the authenticated Lua handler may call the provider.
location = /_internal/ai/groq-chat {
    internal;
    access_log off;

    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_set_header Connection "";
    proxy_set_header Host api.groq.com;
    proxy_set_header Authorization $groq_authorization;
    proxy_set_header Content-Type application/json;
    proxy_set_header X-Request-Id $ai_request_id;
    proxy_set_header Accept-Encoding "";

    proxy_ssl_server_name on;
    proxy_ssl_name api.groq.com;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    proxy_buffering off;
    proxy_request_buffering off;

    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 120s;

    proxy_pass https://api.groq.com/openai/v1/chat/completions;
}
