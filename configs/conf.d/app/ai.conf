location = /ai/chat {
    limit_req zone=ai_chat_limit burst=5 nodelay;
    limit_conn ai_chat_conn_limit 10;

    # Spring owns the public chat contract, model selection, and provider credentials.
    access_by_lua_file /src/lua/app_entry.lua;
    include configs/conf.d/shared/proxy_header.conf;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header X-Request-Id $http_x_request_id;

    proxy_buffering off;
    proxy_request_buffering off;

    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 120s;

    proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
}
