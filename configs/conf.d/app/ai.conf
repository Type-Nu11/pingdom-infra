location = /ai/chat {
    limit_req zone=ai_chat_limit burst=5 nodelay;
    limit_conn ai_chat_conn_limit 10;

    access_by_lua_file /src/lua/ai_entry.lua;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host api.groq.com;

    proxy_ssl_server_name on;
    proxy_ssl_name api.groq.com;

    proxy_buffering off;
    proxy_request_buffering off;

    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 120s;

    proxy_pass https://api.groq.com/openai/v1/chat/completions;
}