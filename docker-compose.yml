services:
  reverse-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: l7-reverse-proxy
    ports:
      - "8081:8081"
    environment:
      HMAC_SECRET_KEY: "local-test-secret"
      JWT_SECRET_KEY: "local-test-secret"
      AI_API_KEY: "${AI_API_KEY}"
      AI_API_HOST: "api.groq.com"
      RUST_VALIDATOR_LIB: "/usr/local/lib/libapp_validator.so"
      WEB_GUARD_LIB: "/usr/local/lib/libweb_guard.so"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: eclipse-temurin:21-jre
    container_name: l7-backend
    working_dir: /app
    expose:
      - "8080"
    volumes:
      - ./backend/app.jar:/app/app.jar:ro
    command: ["java", "-jar", "app.jar"]