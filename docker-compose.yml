services:
  reverse-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: l7-reverse-proxy
    ports:
      # Same-host Rust edge is the only public entry point.
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8082:8082"
    environment:
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-}"
      APP_MIN_VERSION: "${APP_MIN_VERSION:-0.0.0}"
      BACKEND_HOST: "${BACKEND_HOST:-backend}"
      BACKEND_PORT: "${BACKEND_PORT:-8080}"
      CONSOLE_HOST: "${CONSOLE_HOST:-}"
      CONSOLE_PORT: "${CONSOLE_PORT:-8082}"
      REDIS_HOST: "${REDIS_HOST:-}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      AI_API_KEY: "${AI_API_KEY:-}"
      PINGCHA_ENABLED: "${PINGCHA_ENABLED:-false}"
      RUST_VALIDATOR_LIB: "${RUST_VALIDATOR_LIB:-/usr/local/lib/libapp_validator.so}"
      WEB_GUARD_LIB: "${WEB_GUARD_LIB:-/usr/local/lib/libweb_guard.so}"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: eclipse-temurin:21-jre
    container_name: l7-backend
    working_dir: /app
    expose:
      - "8080"
    volumes:
      - ./backend/app.jar:/app/app.jar:ro
    command: ["java", "-jar", "app.jar"]

# Pin the host-side bridge address used by the real-IP trust policy.
# If this subnet conflicts with the host/VPC, change it and real_ip.conf together.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.79.0/24
          gateway: 172.30.79.1
